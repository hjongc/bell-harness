name: check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: scripts/check
      - run: python3 lib/privacy.py
      - run: python3 lib/decisions.py
